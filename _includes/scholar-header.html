<header class="site-header">
  {% if page.layout == 'home' %}
    <h1 class="site-identity">{{ site.title | escape }}</h1>
  {% else %}
    <a class="site-identity" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
  {% endif %}

  <nav class="site-navigation" aria-label="Primary navigation">
    <a href="{{ '/archives/' | relative_url }}"{% if page.url == '/archives/' %} aria-current="page"{% endif %}>Archive</a>
    <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
    <button class="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false">Dark theme</button>
  </nav>
</header>
